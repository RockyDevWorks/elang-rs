name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic, reproducible builds; fail on warnings.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    # Linux-only run: macOS/Windows GitHub-hosted runners are scarce
    # and routinely back the queue up to 30+ minutes for a workspace
    # of this size — long enough that CI feedback on PRs is useless.
    # elang-rs has no OS-specific Rust code (no `#[cfg(unix)]` /
    # `#[cfg(windows)]`, no FFI, all deps cross-platform pure-Rust), so
    # dropping the matrix loses no real coverage; cross-platform
    # validation is deferred to release builds.
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-features

  docker-build-smoke:
    # Build the production image and smoke-test that the binary
    # boots, binds the port, and serves /healthz. Catches Dockerfile
    # regressions (build context, base image, missing tools) and
    # startup-time bugs that `cargo build --workspace` would miss.
    # The GHA cache layer keeps cold builds near ~3 min; warm builds
    # under 60 s.
    name: docker build + smoke (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/elang-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: elang-server:smoke
          cache-from: type=gha,scope=elang-server-smoke
          cache-to: type=gha,scope=elang-server-smoke,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --rm --name elang-smoke \
            -p 8080:8080 \
            -e ELANG_SERVER_PORT=8080 \
            -e ELANG_SERVER_MAX_BODY_BYTES=10485760 \
            -e ELANG_SERVER_TIMEOUT_MS=30000 \
            -e ELANG_SERVER_MAX_CONCURRENT=4 \
            elang-server:smoke
          trap 'docker stop elang-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::smoke test failed: /healthz never responded" >&2
          docker logs elang-smoke >&2 || true
          exit 1

  docker-buildx-multiarch:
    # Build the image for amd64 + arm64 to catch cross-arch compile
    # errors. arm64 uses qemu emulation (~5 min cold; cached after
    # first run). The build output is discarded — only success/fail
    # is checked. No push to a registry.
    name: docker buildx multi-arch (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Build multi-arch
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha,scope=elang-server-multiarch \
            --cache-to type=gha,scope=elang-server-multiarch,mode=max \
            -f crates/elang-server/Dockerfile \
            .

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  docs:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  audit:
    name: dependency + license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
