# Build and deploy the Zensical documentation site to GitHub Pages.
#
# Dedicated to documentation only — the Rust crate's CI lives in ci.yml and
# security.yml and is intentionally left untouched.
#
# Based on the official Zensical publishing guide:
# https://zensical.org/docs/publish-your-site/
# Adapted to run `zensical build --strict` so broken internal links or other
# strict-mode problems fail the build.
name: Documentation

on:
  push:
    branches:
      - main
    # Only rebuild when documentation inputs change.
    paths:
      - "docs/public/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least-privilege by default; the deploy job requests what Pages needs.
permissions:
  contents: read

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"

      # Pinned to an exact version with the wheel's sha256 — closes the
      # Scorecard `pipCommand not pinned by hash` check. The hash is the
      # `manylinux_2_17_x86_64` wheel (the only platform this Linux-only
      # CI runs on); a multi-platform install would need a `requirements.txt`
      # with one --hash per wheel.
      - name: Install Zensical
        run: |
          pip install \
            zensical==0.0.73 \
            --hash=sha256:78b45462e8925f8eb1d45aeed09dea1450c57d2533bfc28214af4a4a9e910e9e

      - name: Build with strict mode
        run: zensical build --strict --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          # Matches `site_dir` in zensical.toml.
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
