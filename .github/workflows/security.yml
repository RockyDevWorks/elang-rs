name: Security

# Security scanning for the ELANG Rust workspace: static analysis (CodeQL),
# vulnerability + license auditing (cargo-audit, cargo-deny), PR dependency
# review, and OpenSSF Scorecard. The RustSec advisory DB moves independently of
# our pinned deps, so the audit also runs on a schedule, not just on changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 05:30 UTC: catch newly-published advisories against pinned deps.
    - cron: "30 5 * * *"
  workflow_dispatch:

# Least-privilege by default; jobs widen scope only where they must.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: RustSec advisory audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Supply-chain policy check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Enforces the full deny.toml policy: known advisories, crate bans,
          # allowed licenses and trusted sources (docs/supply-chain.md).
          arguments: --all-features

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # PR-only: diffs the dependency manifest and blocks vulnerable or
    # disallowed-license additions before they merge.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # Keep in step with deny.toml's license allowlist.
          allow-licenses: Apache-2.0, Apache-2.0 WITH LLVM-exception, MIT, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, Unicode-DFS-2016, Zlib

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Supply-chain posture scoring. Runs on pushes to main and on schedule;
    # results are uploaded to the Security tab.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run analysis
        # scorecard-action does not publish a floating `v2` tag, so pin to a
        # full release tag (latest stable at time of writing).
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif