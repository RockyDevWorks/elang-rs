# Codecov configuration for the ELANG Rust workspace.
# Coverage is a signal, not a merge gate for v0.1.0: informational status checks
# only, so a small dip never blocks a correct security/spec fix.
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: true

ignore:
  # Code-generation and vector-builder binaries are exercised by their own
  # determinism tests; they are tooling, not shipped library surface.
  - "**/src/bin/**"
  - "crates/elang-conformance/src/binary_vectors.rs"
  # Test-support module: fixtures are read from disk, never executed as logic
  # beyond the four loader functions, all four of which are covered.
  - "crates/elang-container/src/testdata.rs"