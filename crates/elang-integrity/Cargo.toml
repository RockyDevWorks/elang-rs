[package]
name = "elang-integrity"
description = "ELANG integrity manifest parsing and SHA-256 verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
elang-core.workspace = true
elang-kdl.workspace = true
# Required for NFC + forbidden-category enforcement on `resource` path args
# (grammar §1: "KDL 2.0, strict UTF-8, enforced NFC"). The KDL parser is
# syntax-only; the schema layer is responsible for NFC. `design.md` row for
# `elang-integrity` is corrected to include `unicode` in this PR (it was an
# oversight when the crate stub was created).
elang-unicode.workspace = true
# Streaming SHA-256 hasher for the verify path (T0706). Version pinned
# workspace-wide (`sha2 = "=0.11.1"`, T0012).
sha2.workspace = true
