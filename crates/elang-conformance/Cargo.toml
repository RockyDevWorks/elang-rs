[package]
name = "elang-conformance"
description = "ELANG conformance fixture runner and interoperability checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
elang-core.workspace = true
elang-container.workspace = true
elang-epf.workspace = true
elang-eld.workspace = true
elang-integrity.workspace = true
elang-kdl.workspace = true
elang-repertoire.workspace = true
# Phase 14 conformance corpus (T1402, T1417, T1418) builds real `.elang`
# archives via the writer and roundtrips them through the reader. The
# corpus deliberately depends on the production reader/writer APIs so
# conformance drift cannot pass locally.
elang-reader.workspace = true
elang-unicode.workspace = true
elang-writer.workspace = true
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Phase 15 property tests (T1509–T1511). Property-based testing gives the
# conformance corpus a `proptest!`-style shrinkage + replay loop, so a
# regression in canonicalisation, roundtrip or bytewise ordering surfaces
# with the smallest failing input rather than the full corpus case that
# happened to fail.
proptest.workspace = true
