[workspace]
resolver = "2"
members = [
    "crates/elang-core",
    "crates/elang-container",
    "crates/elang-kdl",
    "crates/elang-epf",
    "crates/elang-eld",
    "crates/elang-repertoire",
    "crates/elang-integrity",
    "crates/elang-conformance",
    "crates/elang-reader",
    "crates/elang-cli",
    "crates/elang-unicode",
    "crates/elang-writer",
]
# Phase 15, T1501+ (Issue #25): the `fuzz/` crate uses cargo-fuzz and is
# built on nightly with sanitizer instrumentation and a different lint
# policy. It is intentionally excluded from `cargo build --workspace`
# so stable and MSRV builds, `cargo clippy --workspace`, `cargo fmt`,
# and CI keep their strict untrusted-input lint rules.
exclude = ["fuzz"]

# Centralized package metadata inherited by every crate via `package.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/elang-lang/elang-rs"
authors = ["ELANG Project"]

# Centralized, pinned dependency versions (T0012). Individual crates opt in with
# `dep.workspace = true`. Keep these exact; supply-chain policy is in SECURITY.md.
[workspace.dependencies]
# Internal crates
elang-core = { path = "crates/elang-core", version = "0.1.0" }
elang-container = { path = "crates/elang-container", version = "0.1.0" }
elang-kdl = { path = "crates/elang-kdl", version = "0.1.0" }
elang-epf = { path = "crates/elang-epf", version = "0.1.0" }
elang-eld = { path = "crates/elang-eld", version = "0.1.0" }
elang-repertoire = { path = "crates/elang-repertoire", version = "0.1.0" }
elang-integrity = { path = "crates/elang-integrity", version = "0.1.0" }
elang-conformance = { path = "crates/elang-conformance", version = "0.1.0" }
elang-reader = { path = "crates/elang-reader", version = "0.1.0" }
elang-unicode = { path = "crates/elang-unicode", version = "0.1.0" }
elang-writer = { path = "crates/elang-writer", version = "0.1.0" }

# External crates (pinned). These are introduced only as the phases that need
# them land; declaring the pinned version here keeps it reviewable in one place.
sha2 = "=0.11.1"
# Unicode 18.0.0 (NFC + General_Category + noncharacters) is implemented in the
# first-party `elang-unicode` crate from pinned UCD 18.0.0 tables (ADR 0007).
# No third-party Unicode data dependency.
# JSON parsing for the pinned IPA repertoire (T0806). serde_json preserves
# enough structure to enforce no-duplicate-keys and no-unknown-fields.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Zstandard (T0401, REQ-FRAME-001). `zstd` and `zstd-sys` are pinned
# exactly: the libzstd version bundled by `zstd-sys` is part of the canonical
# frame byte contract (REQ-FRAME-010/011). The `+zstd.1.5.7` build-metadata
# suffix that older advisories suggested is ignored by Cargo semver (and
# triggers a lint warning); the actual libzstd version lives in
# `zstd-sys`'s own `build.rs` and is verified at the FFI boundary in
# `elang-container`.
zstd = "=0.14.3"
zstd-safe = "=8.2.0"
zstd-sys = "=2.1.2"
# Argument parsing for the elang CLI (Phase 13, T1311). Zero transitive
# dependencies; aligns with the `cargo-deny` ban on wildcards and the
# minimal-deps policy from ADR 0001.
pico-args = "=0.5.0"
# Property-based testing for the Phase 15 conformance property tests
# (T1509–T1511). Pinned exactly, MIT/Apache-2.0 dual-licensed (already in
# `deny.toml`'s allow list). Pulled in only by the conformance crate's
# `[dev-dependencies]`; the rest of the workspace stays proptest-free.
proptest = "=1.12.0"

# Differential-testing harness for T1518. Pulls in the official `kdl`
# parser crate (Apache-2.0, in `deny.toml`'s allow list) so the surface
# parser can be cross-checked against an independent implementation.
# Dev-only — `elang-kdl`'s `[dev-dependencies]` is the only consumer;
# the production binary never links `kdl`. ADR 0010's "hand-rolled"
# rationale stands; this is a cross-check, not a replacement.
kdl = "=6.7.1"

# Workspace-wide lint policy (T0215). Untrusted-input safety is enforced by
# denying panic-prone constructs. These are inherited via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"          # allowed only at audited FFI boundaries (libzstd), see SECURITY.md
missing_docs = "warn"

[workspace.lints.clippy]
# Deny panic-prone operations on untrusted data.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Catches unchecked integer math on untrusted input; explicit `checked_*` helpers
# (Phase 2) are the sanctioned alternative.
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[profile.release]
# Deterministic, reproducible release builds (T1615).
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.dev]
# Keep overflow checks on in dev too: the spec requires checked arithmetic on
# untrusted input, and this catches accidental unchecked math early.
overflow-checks = true
