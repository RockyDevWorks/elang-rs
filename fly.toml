# Fly.io configuration for the elang-server HTTP service.
#
# `fly.toml` lives at the workspace root because the build context for
# the `Dockerfile` referenced below MUST be the workspace root — that
# Dockerfile does `COPY Cargo.toml Cargo.lock ./` so dependency resolution
# runs against the workspace's locked pin, not a stale local clone.
# Putting `fly.toml` next to `Cargo.toml` keeps the build context and the
# workspace manifest in the same directory.
#
# Deploy from the workspace root:
#   fly launch --path . --copy-config --no-deploy --config fly.toml --dockerfile crates/elang-server/Dockerfile
#   fly deploy . --config fly.toml --dockerfile crates/elang-server/Dockerfile
#
# The `app` name below is a placeholder — `fly launch` will prompt for a
# unique name. After the first deploy, set the Hub's `SDK_SERVICE_URL` to
# `https://<app-name>.fly.dev`.

app = "elang-server"
primary_region = "iad"

[build]
  dockerfile = "crates/elang-server/Dockerfile"

[env]
  ELANG_SERVER_PORT = "8080"
  ELANG_SERVER_MAX_BODY_BYTES = "10485760"
  ELANG_SERVER_TIMEOUT_MS = "30000"
  ELANG_SERVER_MAX_CONCURRENT = "4"

[http_service]
  internal_port = 8080
  force_https = true
  # Auto-stop would add a cold start to every interactive validation
  # request, so keep the machine running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The health check hits /healthz, which is deliberately NOT part of the
  # SDK wire contract — a Hub version mismatch must never mask a service
  # outage from the orchestrator.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # Four jobs each admit at most 8 MiB decoded bytes and an 8 MiB Zstd
  # window. Leave room for compressed bodies, metadata, parsers and runtime.
  memory = "512mb"
