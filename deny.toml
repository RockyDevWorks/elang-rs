# cargo-deny configuration (REQ-GOV-SUPPLY-001). See docs/supply-chain.md.

[advisories]
# Fail CI on known security advisories for any dependency.
yanked = "deny"

[licenses]
# Permissive licenses compatible with Apache-2.0. Adding a copyleft dependency
# requires an ADR and an explicit exception here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    # NCSA (University of Illinois/NCSA Open Source License) — permissive,
    # MIT-compatible, and the license of the LLVM/libFuzzer toolchain that
    # `libfuzzer-sys` (the `cargo-fuzz` harness runtime, Phase 15 T1501+)
    # links against. `libfuzzer-sys` is licensed `(MIT OR Apache-2.0) AND
    # NCSA`; the NCSA term covers the vendored libFuzzer C++ sources. The
    # fuzz crate is excluded from the workspace, so this rule does not
    # currently apply to it — it is listed so the policy stays correct if
    # the fuzz crate is ever folded into the workspace graph.
    "NCSA",
]
confidence-threshold = 0.9

[bans]
# Reproducibility: avoid accidental multiple versions of the same crate.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and the project's own git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
