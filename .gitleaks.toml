# Gitleaks configuration for ELANG-rs.
#
# `gitleaks detect --source .` is run by the validation workflow
# (and locally via `scripts/validate-local.sh`) against the full
# git history, not just the diff. Path exemptions cover generated
# build outputs, the generated docs site, and fuzz/property-test
# artifacts. Source, tests, specs, decisions, and human-written
# documentation are scanned.
#
# The Hub's sister config (`RockyDevWorks/elang-hub/.gitleaks.toml`)
# is the menu reference; this file mirrors its structure with
# paths swapped to the Rust workspace's actual directories.

title = "elang-rs gitleaks"

[extend]
# Community default ruleset plus a single elang-rs rule below.
useDefault = true

[allowlist]
description = "ELANG-rs safe allowlist"
paths = [
	# Pinned public HTML snapshot (SHA-256 in specs/sources/SOURCES.md).
	# Its embedded Drupal theme_token is public website metadata.
	'''^specs/sources/ipa-association-full-chart\.html$''',
	'''fuzz/corpus/.*''',
	'''fuzz/artifacts/.*''',
	'''crates/.*/proptest-regressions/.*''',
	'''target/.*''',
	'''fuzz/target/.*''',
	'''site/.*''',
	'''cache/.*'''
]
regexes = [
	# `user:pass@host` test fixtures with obviously-fake credentials.
	'''^https?://user:pass@(fake-host|host)\.invalid(?:$|[^@a-zA-Z0-9.:\[\]-])$''',
	# The local scanner regression fixture uses this exact endpoint.
	'''^http://user:pass@localhost:3000(?:$|[^@a-zA-Z0-9.:\[\]-])$'''
]
# Exempt only these exact synthetic endpoints, including a consumed delimiter.
regexTarget = "match"

[[rules]]
id = "credential-url"
description = "HTTP URL containing credentials"
# Escapes must be complete bytes. Include ports in the match so the
# exact fixture allowlist cannot hide credentials on another port. Consume
# chained @-hosts and a non-host/non-@ delimiter (or end of input) so a
# truncated localhost match cannot hide a URL ending at an attacker host.
regex = '''https?://(?:[a-zA-Z0-9._-]|%[a-fA-F0-9]{2})+:(?:[a-zA-Z0-9._-]|%[a-fA-F0-9]{2})+@(?:[a-zA-Z0-9.-]+|\[::1\])(?::[0-9]+)?(?:@(?:[a-zA-Z0-9.-]+|\[::1\])(?::[0-9]+)?)*(?:$|[^@a-zA-Z0-9.:\[\]-])'''
