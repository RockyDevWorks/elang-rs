# Gitleaks configuration for ELANG-rs.
#
# `gitleaks detect --source .` is run by the validation workflow
# (and locally via `scripts/validate-local.sh`) against the full
# git history, not just the diff. The allowlist paths cover
# generated content only — build outputs, generated docs site,
# vendored toolchains, fuzz runtime data, and proptest regression
# fixtures. Human-written content (source, tests, ADRs, specs,
# steering files, README, CHANGELOG, etc.) is always scanned; any
# intentional example URL in those surfaces must be matched by an
# explicit allowlist regex below, not by a broad stopword.
#
# The Hub's sister config (`RockyDevWorks/elang-hub/.gitleaks.toml`)
# is the menu reference; this file mirrors its structure with
# paths swapped to the Rust workspace's actual directories.

title = "elang-rs gitleaks"

[extend]
# Community default ruleset plus a single elang-rs rule below.
useDefault = true

[allowlist]
description = "ELANG-rs safe allowlist"
# Generated / machine-produced content only. Anything human-written
# (source, tests, ADRs, specs, .kiro, README, CHANGELOG, etc.) is
# scanned; broad stopwords that suppress any secret containing a
# substring like "example" are intentionally absent so a real
# credential containing that substring is not silently dropped.
paths = [
	'''docs/public/.*''',
	'''fuzz/corpus/.*''',
	'''fuzz/artifacts/.*''',
	'''crates/.*/proptest-regressions/.*''',
	'''target/.*''',
	'''fuzz/target/.*''',
	'''site/.*''',
	'''cache/.*'''
]
# Exact, anchored fixture URLs. Anything that is *not* matched here
# is reported, including intentional-looking examples that share a
# substring with these fixtures. To allow a new fixture, add its
# exact full URL with `^...$` anchors — never a substring match.
regexes = [
	# `user:pass@host` test fixtures with obviously-fake credentials.
	'''^https?://user:pass@(fake-host|host)\.invalid$''',
	# The local scanner regression fixture uses this exact endpoint.
	'''^http://user:pass@localhost:3000$'''
]

[[rules]]
id = "credential-url"
description = "HTTP URL containing credentials"
# Escapes must be complete bytes. Include ports in the match so the
# exact fixture allowlist cannot hide credentials on another port.
# Consume any additional `@host[:port]` segments so a URL-confusion
# attack like `http://user:pass@localhost:3000@attacker.tld` is
# captured as a single finding (the trailing host makes the URL no
# longer match the anchored `^http://user:pass@localhost:3000$`
# allowlist entry above, so the finding is reported).
regex = '''https?://(?:[a-zA-Z0-9._-]|%[a-fA-F0-9]{2})+:(?:[a-zA-Z0-9._-]|%[a-fA-F0-9]{2})+@(?:[a-zA-Z0-9.-]+|\\[::1\\])(?::[0-9]+)?(?:@[a-zA-Z0-9.-]+(?::[0-9]+)?)*(?:[^@]|$)'''